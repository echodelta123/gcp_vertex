# Cloud Build configuration for Vertex AI Customer Demo
# Triggered on push to main branch or manually via gcloud builds submit

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA']

  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA', 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:latest']

  # Deploy Sentiment API
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sentiment-api'
      - '--image=gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8001'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=DEMO_MODE=true'
      - '--allow-unauthenticated'

  # Deploy Recommender API
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'recommender-api'
      - '--image=gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8002'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=DEMO_MODE=true'
      - '--allow-unauthenticated'

  # Deploy Customer 360 API
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'customer360-api'
      - '--image=gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8003'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=DEMO_MODE=true'
      - '--allow-unauthenticated'

  # Deploy Graph Explorer API
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'graph-explorer-api'
      - '--image=gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8004'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=DEMO_MODE=true'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vertex-ai-customer-demo:latest'

timeout: '1200s'
