services:
  # ─── Demo 1: Sentiment Intelligence Engine ───
  sentiment-api:
    build: .
    command: uvicorn demo_sentiment_categoriser.backend:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sentiment-ui:
    build: .
    command: streamlit run demo_sentiment_categoriser/frontend.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      sentiment-api:
        condition: service_healthy

